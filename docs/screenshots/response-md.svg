<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, sans-serif">
  <rect width="800" height="350" fill="#0d1117"/>
  <!-- tab -->
  <rect x="0" y="0" width="800" height="32" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>
  <text x="12" y="21" fill="#8b949e" font-size="10">Overview</text>
  <text x="80" y="21" fill="#8b949e" font-size="10">Request</text>
  <text x="148" y="21" fill="#58a6ff" font-size="10" font-weight="600">Response</text>
  <rect x="148" y="30" width="62" height="2" fill="#58a6ff"/>
  <text x="218" y="21" fill="#8b949e" font-size="10">JSON (Req)</text>
  <text x="296" y="21" fill="#8b949e" font-size="10">JSON (Res)</text>
  <!-- response header -->
  <rect x="12" y="40" width="40" height="18" rx="3" fill="#161b22" stroke="#30363d"/>
  <text x="20" y="53" fill="#8b949e" font-size="8" text-anchor="middle">MD</text>
  <rect x="56" y="40" width="54" height="18" rx="3" fill="#161b22" stroke="#30363d"/>
  <text x="64" y="53" fill="#8b949e" font-size="8">Expand all</text>
  <text x="120" y="53" fill="#8b949e" font-size="8" font-family="monospace">1.8KB</text>
  <!-- markdown content -->
  <text x="12" y="75" fill="#e6edf3" font-size="12" font-weight="600">在线 SSE / JSON 解析工具推荐</text>
  <text x="12" y="95" fill="#e6edf3" font-size="10">几个好用的纯在线工具（全都在浏览器本地解析，不传服务器）：</text>
  <text x="12" y="115" fill="#e6edf3" font-size="11" font-weight="600">SSE 流式响应解析</text>
  <rect x="12" y="125" width="776" height="42" fill="none" stroke="#30363d" stroke-width="0.5" rx="2"/>
  <line x1="220" y1="125" x2="220" y2="167" stroke="#30363d"/>
  <line x1="380" y1="125" x2="380" y2="167" stroke="#30363d"/>
  <text x="22" y="140" fill="#e6edf3" font-size="9" font-weight="600">Website</text>
  <text x="225" y="140" fill="#e6edf3" font-size="9" font-weight="600">Description</text>
  <text x="388" y="140" fill="#3fb950" font-size="8" font-family="monospace">puredevtools.tools/...</text>
  <text x="388" y="154" fill="#8b949e" font-size="8">Paste raw SSE → auto detect OpenAI/Anthropic format</text>
  <!-- outline panel -->
  <rect x="500" y="70" width="200" height="220" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="512" y="90" fill="#8b949e" font-size="8" text-transform="uppercase">OUTLINE</text>
  <text x="760" y="85" fill="#8b949e" font-size="10" text-anchor="end">✕</text>
  <rect x="512" y="98" width="176" height="16" rx="2" fill="#58a6ff" opacity="0.15"/>
  <text x="520" y="110" fill="#58a6ff" font-size="8" font-weight="600">在线 SSE / JSON 解析工具推荐</text>
  <text x="526" y="124" fill="#8b949e" font-size="8">SSE 流式响应解析</text>
  <text x="546" y="138" fill="#8b949e" font-size="8">JSON / 结构化输出</text>
  <text x="512" y="160" fill="#8b949e" font-size="8">Markdown / 格式化</text>
  <text x="526" y="174" fill="#8b949e" font-size="8">其他工具</text>
  <!-- light theme -->
  <rect x="12" y="185" width="776" height="155" fill="#ffffff" rx="4" stroke="#d0d7de"/>
  <text x="22" y="205" fill="#1f2328" font-size="11" font-weight="600">在线 SSE / JSON 解析工具推荐</text>
  <text x="22" y="222" fill="#1f2328" font-size="9">几个好用的纯在线工具（全都在浏览器本地解析，不传服务器）：</text>
  <text x="22" y="240" fill="#1f2328" font-size="10" font-weight="600">SSE 流式响应解析</text>
  <rect x="22" y="250" width="758" height="38" fill="none" stroke="#d0d7de" stroke-width="0.5" rx="2"/>
  <line x1="200" y1="250" x2="200" y2="288" stroke="#d0d7de"/>
  <line x1="350" y1="250" x2="350" y2="288" stroke="#d0d7de"/>
  <text x="32" y="264" fill="#1f2328" font-size="8" font-weight="600">Website</text>
  <text x="208" y="264" fill="#1f2328" font-size="8" font-weight="600">Description</text>
  <text x="358" y="264" fill="#0969da" font-size="8" font-family="monospace">puredevtools.tools/...</text>
  <text x="358" y="278" fill="#656d76" font-size="7">Paste raw SSE → auto detect OpenAI/Anthropic format</text>
  <text x="22" y="305" fill="#656d76" font-size="7">切换主题</text>
  <!-- theme transition arrow -->
  <text x="380" y="180" fill="#8b949e" font-size="11" text-anchor="middle">◀ Dark / Light ▶</text>
</svg>
