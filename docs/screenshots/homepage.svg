<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, sans-serif">
  <rect width="800" height="450" fill="#0d1117"/>
  <!-- header -->
  <rect x="0" y="0" width="800" height="48" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
  <text x="24" y="30" fill="#e6edf3" font-size="14" font-weight="600">Interceptor Viewer</text>
  <text x="24" y="44" fill="#8b949e" font-size="10">LLM request/response inspector</text>
  <rect x="420" y="12" width="260" height="24" rx="4" fill="#161b22" stroke="#30363d"/>
  <text x="430" y="28" fill="#8b949e" font-size="11">Custom data directory...</text>
  <rect x="685" y="12" width="60" height="24" rx="4" fill="#58a6ff"/>
  <text x="695" y="28" fill="#fff" font-size="11" text-anchor="middle">Scan</text>
  <!-- toggle -->
  <circle cx="760" cy="24" r="8" fill="none" stroke="#30363d"/>
  <circle cx="760" cy="24" r="3" fill="#30363d"/>
  <!-- table -->
  <rect x="0" y="48" width="800" height="402" fill="#0d1117"/>
  <!-- table header -->
  <rect x="0" y="48" width="800" height="28" fill="#161b22"/>
  <text x="16" y="66" fill="#8b949e" font-size="10">Session</text>
  <text x="260" y="66" fill="#8b949e" font-size="10">Calls</text>
  <text x="310" y="66" fill="#8b949e" font-size="10">Provider</text>
  <text x="400" y="66" fill="#8b949e" font-size="10">Status Codes</text>
  <text x="540" y="66" fill="#8b949e" font-size="10">Duration</text>
  <text x="610" y="66" fill="#8b949e" font-size="10">Body Format</text>
  <text x="700" y="66" fill="#8b949e" font-size="10">Time Range</text>
  <!-- row 1 -->
  <rect x="0" y="76" width="800" height="36" fill="#0d1117" stroke="#30363d" stroke-width="0.3"/>
  <text x="16" y="97" fill="#58a6ff" font-size="11" font-family="monospace">ses_1e1f5baa9ffeNIpa...</text>
  <text x="263" y="97" fill="#e6edf3" font-size="12">15</text>
  <text x="310" y="97" fill="#8b949e" font-size="11">anthropic</text>
  <text x="400" y="97" fill="#3fb950" font-size="11" font-family="monospace">200: 15</text>
  <text x="540" y="97" fill="#8b949e" font-size="11" font-family="monospace">16.9s</text>
  <rect x="610" y="82" width="80" height="18" rx="3" fill="#161b22" stroke="#30363d"/>
  <text x="626" y="95" fill="#8b949e" font-size="9" font-family="monospace">replay-text</text>
  <text x="700" y="97" fill="#8b949e" font-size="9" font-family="monospace">2026-05-12 21:16 → 2026-05-13 04:43</text>
  <!-- row 2 -->
  <rect x="0" y="112" width="800" height="36" fill="#161b22" stroke="#30363d" stroke-width="0.3" opacity="0.5"/>
  <text x="16" y="133" fill="#8b949e" font-size="10">No sessions found. Point to a directory containing ses_* folders.</text>
  <!-- bottom bar -->
  <rect x="0" y="425" width="800" height="25" fill="#161b22"/>
  <text x="16" y="441" fill="#8b949e" font-size="9">Ready</text>
